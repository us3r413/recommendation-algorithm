AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Job Recommendation API — EC2 instance with security group.
  Deploys a t3.large instance running Amazon Linux 2023 with port 8000 open.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 key pair for SSH access

  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
    Description: EC2 instance type (t3.large = 8GB RAM recommended minimum)

  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    Description: Root EBS volume size in GB

Mappings:
  RegionAMI:
    us-east-1:
      AMI: ami-0c02fb55956c7d316  # Amazon Linux 2023
    us-west-2:
      AMI: ami-0b20a6f09f8b8c082
    ap-northeast-1:
      AMI: ami-0db86e0da87205543

Resources:
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and API port 8000
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: job-recommend-api-sg

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !FindInMap [RegionAMI, !Ref "AWS::Region", AMI]
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !GetAtt ApiSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: job-recommend-api
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install python3.11 python3.11-pip git -y

Outputs:
  PublicIP:
    Description: Public IP of the API server
    Value: !GetAtt ApiInstance.PublicIp

  PublicDNS:
    Description: Public DNS of the API server
    Value: !GetAtt ApiInstance.PublicDnsName

  SSHCommand:
    Description: SSH command to connect
    Value: !Sub "ssh -i <your-key>.pem ec2-user@${ApiInstance.PublicIp}"

  APIEndpoint:
    Description: API base URL
    Value: !Sub "http://${ApiInstance.PublicIp}:8000"
